# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
# This is required to provide enough memory for the Minecraft decompilation process.
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.configureondemand=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.parallel=true
org.gradle.configuration-cache.problems=warn
net.minecraftforge.gradle.merge-source-sets=true

## Mod metadata - substituted into mods.toml and pack.mcmeta at build time
minecraft_version=1.21.1
minecraft_version_range=[1.21.1,1.22)
forge_version=52.1.14
forge_version_range=[52,)
loader_version_range=[52,)
mod_id=immersivefoods
mod_name=ImmersiveFoods
mod_license=All Rights Reserved
mod_version=1.21.1-0.0.1
mod_authors=EPIICTHUNDERCAT
mod_description=Adds food items from various Minecraft mobs.
